user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format k1 '$remote_addr - $request_id [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log k1;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=k1api:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=k1auth:10m rate=10r/m;

  upstream k1blog {
    server app:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 64k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    location /api/auth/ {
      limit_req zone=k1auth burst=5 nodelay;
      proxy_pass http://k1blog;
    }

    location = /api/v1/admin/moderation/policy {
      client_max_body_size 192k;
      limit_req zone=k1api burst=20 nodelay;
      proxy_pass http://k1blog;
    }

    location /api/ {
      limit_req zone=k1api burst=20 nodelay;
      proxy_pass http://k1blog;
    }

    location /_next/static/ {
      proxy_pass http://k1blog;
      expires 1y;
    }

    location /fonts/ {
      proxy_pass http://k1blog;
      expires 1y;
    }

    location / {
      proxy_pass http://k1blog;
    }
  }
}
