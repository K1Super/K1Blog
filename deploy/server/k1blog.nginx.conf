# 宿主机 Nginx 站点：k1super.xyz
# 应用容器只监听 127.0.0.1:3000，TLS 在此终止；证书由 acme.sh 续期并自动 reload。

limit_req_zone $binary_remote_addr zone=k1_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=k1_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=k1_api:10m rate=120r/m;

upstream k1blog_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name k1super.xyz;

    server_tokens off;

    # acme.sh 使用 webroot 方式续期，明文校验必须排在跳转之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://k1super.xyz$request_uri;
    }

    access_log /var/log/nginx/k1blog.access.log;
    error_log  /var/log/nginx/k1blog.error.log warn;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.k1super.xyz;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://k1super.xyz$request_uri;
    }

    access_log /var/log/nginx/k1blog.access.log;
    error_log  /var/log/nginx/k1blog.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.k1super.xyz;

    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/www.k1super.xyz.cer;
    ssl_certificate_key /etc/nginx/ssl/www.k1super.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://k1super.xyz$request_uri;

    access_log /var/log/nginx/k1blog.access.log;
    error_log  /var/log/nginx/k1blog.error.log warn;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name k1super.xyz;

    server_tokens off;
    client_max_body_size 64k;
    limit_req_status 429;

    ssl_certificate     /etc/nginx/ssl/k1super.xyz.cer;
    ssl_certificate_key /etc/nginx/ssl/k1super.xyz.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（CSP/HSTS 等）由应用统一输出，避免网关与框架重复下发
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = /api/auth/sign-in/email {
        limit_req zone=k1_login burst=5 nodelay;
        proxy_pass http://k1blog_app;
    }

    location = /api/auth/sign-in/username {
        limit_req zone=k1_login burst=5 nodelay;
        proxy_pass http://k1blog_app;
    }

    location /api/auth/ {
        limit_req zone=k1_auth burst=10 nodelay;
        proxy_pass http://k1blog_app;
    }

    location = /api/v1/admin/moderation/policy {
        client_max_body_size 192k;
        limit_req zone=k1_api burst=30 nodelay;
        proxy_pass http://k1blog_app;
    }

    location /api/ {
        limit_req zone=k1_api burst=30 nodelay;
        proxy_pass http://k1blog_app;
    }

    location /_next/static/ {
        proxy_pass http://k1blog_app;
        expires 1y;
    }

    location /fonts/ {
        proxy_pass http://k1blog_app;
        expires 1y;
    }

    location / {
        proxy_pass http://k1blog_app;
    }

    access_log /var/log/nginx/k1blog.access.log;
    error_log  /var/log/nginx/k1blog.error.log warn;
}
